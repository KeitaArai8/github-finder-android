version: 2
updates:
  # Gradle 依存（Room / Hilt / Compose BOM 等の更新 PR を自動生成。Coil / Retrofit / OkHttp / Turbine は ignore で対象外）
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "chore(deps)"
    # サードパーティ OSS（Coil / Retrofit / OkHttp / Turbine）は各ライブラリのリリースではなく Now in Android の採用に合わせて更新する
    ignore:
      - dependency-name: "io.coil-kt*"
      - dependency-name: "com.squareup.retrofit2*"
      - dependency-name: "com.squareup.okhttp3*"
      - dependency-name: "app.cash.turbine*"
    # Compose BOM など、大きなバージョンアップは手動確認するためにグループ化
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      hilt:
        patterns:
          - "com.google.dagger*"

  # GitHub Actions の action バージョン更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
