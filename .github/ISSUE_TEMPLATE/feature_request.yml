name: 機能要望
description: 新機能や改善の提案
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。学習サンプルとしての範囲を超える場合は不採用となることもありますが、まずは議論させてください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どんな体験/学習要素が不足していますか？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 具体的な機能・UI・API 等
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他の実装方法・既存機能との使い分け等

  - type: dropdown
    id: scope
    attributes:
      label: 想定スコープ
      options:
        - UI / UX 改善
        - 新機能追加
        - アーキテクチャ・設計
        - テスト / CI
        - ドキュメント
        - その他
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 確認事項
      options:
        - label: 既存の Issue / Discussion を検索し、重複がないことを確認しました
          required: true
        - label: 学習サンプルとしての範囲に収まる提案であることを認識しています
          required: true
